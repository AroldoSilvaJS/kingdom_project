{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col gap-4 mt-2 pb-40">
    
    <!-- ENCABEZADO Y VOLVER -->
    <div class="flex justify-between items-center px-1">
        <button type="button" onclick="universalNav('/economy/wallet/')" 
           class="text-xs text-vip-text/70 hover:text-vip-gold bg-black/60 px-3.5 py-1.5 rounded-full border border-vip-gold/30 flex items-center gap-1 active:scale-95 transition-all">
            ⬅ Bóveda
        </button>
        <div class="flex items-center gap-1.5 bg-black/60 border border-vip-gold/30 px-3 py-1.5 rounded-full shadow-inner">
            <span class="text-xs">🪙</span>
            <span class="text-xs font-mono font-bold text-gold-gradient" id="top-user-balance">{{ wallet.balance }}</span>
        </div>
    </div>

    <!-- MESA DE RULETA VIP ANIMADA -->
    <div class="vip-panel p-5 text-center relative overflow-hidden flex flex-col items-center border border-vip-gold/40 shadow-2xl">
        
        <h2 class="font-serif text-lg font-black text-gold-gradient uppercase tracking-wider">
            Ruleta Real Europea
        </h2>
        <p class="text-[11px] text-vip-text/60 mb-2">Tope de tu rango: <strong class="text-yellow-400 font-mono">{{ max_bet }} 🪙</strong></p>

        <!-- RUEDA GIRATORIA CON FÍSICA SUAVE -->
        <div class="relative my-4 flex items-center justify-center">
            
            <!-- Puntero indicador superior -->
            <div class="absolute -top-3.5 z-30 text-yellow-400 text-2xl filter drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)] animate-pulse">
                ▼
            </div>

            <!-- Disco exterior con casilleros -->
            <div id="roulette-wheel" class="w-52 h-52 rounded-full border-4 border-vip-gold shadow-[0_0_35px_rgba(212,175,55,0.35)] flex items-center justify-center relative overflow-hidden transition-transform duration-[3500ms] cubic-bezier(0.12, 0.8, 0.2, 1)" 
                 style="background: conic-gradient(#dc2626 0deg 9.7deg, #171717 9.7deg 19.4deg, #dc2626 19.4deg 29.1deg, #171717 29.1deg 38.8deg, #dc2626 38.8deg 48.5deg, #16a34a 48.5deg 58.2deg, #dc2626 58.2deg 67.9deg, #171717 67.9deg 77.6deg, #dc2626 77.6deg 87.3deg, #171717 87.3deg 97deg, #dc2626 97deg 106.7deg, #171717 106.7deg 116.4deg, #dc2626 116.4deg 126.1deg, #171717 126.1deg 135.8deg, #dc2626 135.8deg 145.5deg, #171717 145.5deg 155.2deg, #dc2626 155.2deg 164.9deg, #171717 164.9deg 174.6deg, #dc2626 174.6deg 184.3deg, #171717 184.3deg 194deg, #dc2626 194deg 203.7deg, #171717 203.7deg 213.4deg, #dc2626 213.4deg 223.1deg, #171717 223.1deg 232.8deg, #dc2626 232.8deg 242.5deg, #171717 242.5deg 252.2deg, #dc2626 252.2deg 261.9deg, #171717 261.9deg 271.6deg, #dc2626 271.6deg 281.3deg, #171717 281.3deg 291deg, #dc2626 291deg 300.7deg, #171717 300.7deg 310.4deg, #dc2626 310.4deg 320.1deg, #171717 320.1deg 329.8deg, #dc2626 329.8deg 339.5deg, #171717 339.5deg 349.2deg, #dc2626 349.2deg 360deg);">
                
                <!-- Centro de latón dorado -->
                <div id="center-disc" class="w-24 h-24 rounded-full bg-gradient-to-br from-[#2c1404] via-black to-[#130701] border-2 border-vip-gold/80 flex flex-col items-center justify-center z-10 shadow-2xl transition-all">
                    <span id="center-display-num" class="text-3xl font-black font-mono text-white drop-shadow">
                        👑
                    </span>
                    <span id="center-display-text" class="text-[9px] uppercase font-bold text-vip-gold tracking-widest mt-0.5">
                        Casino
                    </span>
                </div>
            </div>

        </div>

        <!-- BANNER DE RESULTADO DINÁMICO -->
        <div id="roulette-result-box" class="w-full min-h-[46px] flex items-center justify-center my-1">
            <span class="text-xs text-vip-text/50">Elige tu casillero y gira la ruleta</span>
        </div>

        <!-- CONTROLES DE APUESTA -->
        <div class="w-full flex flex-col gap-3 mt-1">
            <input type="hidden" id="bet_choice_input" value="red">

            <!-- 1. SELECCIÓN DE CASILLERO -->
            <div>
                <label class="block text-[11px] text-vip-gold uppercase font-bold mb-1.5 text-left">1. Selecciona tu Casillero</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="selectChoice('red')" id="btn-choice-red"
                            class="py-3 rounded-xl border-2 border-red-500 bg-red-600/40 text-white text-xs font-black uppercase flex flex-col items-center justify-center transition-all shadow-[0_0_15px_rgba(239,68,68,0.4)] scale-105">
                        <span class="text-base mb-0.5">🔴</span>
                        <span>Rojo</span>
                        <span class="text-[9px] font-mono opacity-80">x2.0</span>
                    </button>

                    <button type="button" onclick="selectChoice('black')" id="btn-choice-black"
                            class="py-3 rounded-xl border border-neutral-700 bg-neutral-900/60 text-neutral-300 text-xs font-black uppercase flex flex-col items-center justify-center hover:border-neutral-500 transition-all">
                        <span class="text-base mb-0.5">⚫</span>
                        <span>Negro</span>
                        <span class="text-[9px] font-mono opacity-80">x2.0</span>
                    </button>

                    <button type="button" onclick="selectChoice('zero')" id="btn-choice-zero"
                            class="py-3 rounded-xl border border-green-900 bg-green-950/30 text-green-400 text-xs font-black uppercase flex flex-col items-center justify-center hover:border-green-500 transition-all">
                        <span class="text-base mb-0.5">🟢</span>
                        <span>Cero (0)</span>
                        <span class="text-[9px] font-mono text-yellow-400 font-bold">x14</span>
                    </button>
                </div>
            </div>

            <!-- 2. MONTO DE APUESTA (BOTONES ADAPTADOS AL RANGO) -->
            <div>
                <label class="block text-[11px] text-vip-gold uppercase font-bold mb-1.5 text-left">2. Oro a Apostar (Máx: {{ max_bet }} 🪙)</label>
                <div class="grid grid-cols-4 gap-1.5 mb-2">
                    {% if max_bet <= 25 %}
                        <button type="button" onclick="setBet(5)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">5</button>
                        <button type="button" onclick="setBet(10)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">10</button>
                        <button type="button" onclick="setBet(15)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">15</button>
                        <button type="button" onclick="setBet({{ max_bet }})" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">{{ max_bet }}</button>
                    {% elif max_bet <= 50 %}
                        <button type="button" onclick="setBet(10)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">10</button>
                        <button type="button" onclick="setBet(25)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">25</button>
                        <button type="button" onclick="setBet(35)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">35</button>
                        <button type="button" onclick="setBet({{ max_bet }})" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">{{ max_bet }}</button>
                    {% else %}
                        <button type="button" onclick="setBet(10)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">10</button>
                        <button type="button" onclick="setBet(25)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">25</button>
                        <button type="button" onclick="setBet(50)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">50</button>
                        <button type="button" onclick="setBet({{ max_bet }})" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-lg text-xs font-mono font-bold">{{ max_bet }}</button>
                    {% endif %}
                </div>
                <input type="number" id="bet_amount_input" min="1" max="{{ max_bet }}" value="{% if max_bet < 25 %}{{ max_bet }}{% else %}25{% endif %}"
                       class="w-full bg-black/80 border border-vip-gold/40 rounded-xl p-2.5 text-center font-mono font-bold text-white text-base focus:outline-none focus:border-vip-gold">
            </div>

            <!-- BOTÓN DE GIRO CON FÍSICA INMEDIATA -->
            <button type="button" id="roulette-spin-btn" onclick="startRouletteSpin()" 
                    class="btn-gold py-4 rounded-xl text-xs font-black uppercase tracking-wider shadow-[0_0_20px_rgba(212,175,55,0.4)] mt-1 flex items-center justify-center gap-2 active:scale-95 transition-all">
                <span>🎡</span> Girar Ruleta Imperial
            </button>
        </div>

    </div>

</div>

<!-- SCRIPT CON RESPUESTA EN VIVO, HÁPTICOS Y ACTUALIZACIÓN EN TIEMPO REAL -->
<script>
    const tg = window.Telegram?.WebApp;
    let isSpinning = false;
    let currentDegrees = 0;

    function selectChoice(choice) {
        if (isSpinning) return;
        document.getElementById('bet_choice_input').value = choice;
        const btnRed = document.getElementById('btn-choice-red');
        const btnBlack = document.getElementById('btn-choice-black');
        const btnZero = document.getElementById('btn-choice-zero');

        btnRed.className = "py-3 rounded-xl border border-red-900 bg-red-950/30 text-red-300 text-xs font-black uppercase flex flex-col items-center justify-center transition-all";
        btnBlack.className = "py-3 rounded-xl border border-neutral-700 bg-neutral-900/60 text-neutral-300 text-xs font-black uppercase flex flex-col items-center justify-center transition-all";
        btnZero.className = "py-3 rounded-xl border border-green-900 bg-green-950/30 text-green-400 text-xs font-black uppercase flex flex-col items-center justify-center transition-all";

        if (choice === 'red') {
            btnRed.className = "py-3 rounded-xl border-2 border-red-500 bg-red-600/40 text-white text-xs font-black uppercase flex flex-col items-center justify-center transition-all shadow-[0_0_15px_rgba(239,68,68,0.4)] scale-105";
        } else if (choice === 'black') {
            btnBlack.className = "py-3 rounded-xl border-2 border-neutral-400 bg-neutral-900 text-white text-xs font-black uppercase flex flex-col items-center justify-center transition-all shadow-[0_0_15px_rgba(255,255,255,0.2)] scale-105";
        } else if (choice === 'zero') {
            btnZero.className = "py-3 rounded-xl border-2 border-green-500 bg-green-700/50 text-white text-xs font-black uppercase flex flex-col items-center justify-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.4)] scale-105";
        }
    }

    function setBet(amount) {
        if (isSpinning) return;
        document.getElementById('bet_amount_input').value = amount;
    }

    async function startRouletteSpin() {
        if (isSpinning) return;
        
        const betAmount = parseInt(document.getElementById('bet_amount_input').value, 10);
        const betChoice = document.getElementById('bet_choice_input').value;
        const btn = document.getElementById('roulette-spin-btn');
        const wheel = document.getElementById('roulette-wheel');
        const resultBox = document.getElementById('roulette-result-box');
        const centerNum = document.getElementById('center-display-num');
        const centerText = document.getElementById('center-display-text');
        const centerDisc = document.getElementById('center-disc');
        const balanceElem = document.getElementById('top-user-balance');

        if (!betAmount || betAmount <= 0) {
            resultBox.innerHTML = '<span class="text-xs text-red-400 font-bold">⚠️ Ingresa una apuesta válida</span>';
            return;
        }

        // Obtener el ID REAL del usuario (nunca 123456789)
        const tgId = (typeof window.getGlobalTgId === 'function') ? window.getGlobalTgId() : '{{ tg_id }}';
        
        const formData = new FormData();
        formData.append('tg_id', tgId);
        formData.append('bet_amount', betAmount);
        formData.append('bet_choice', betChoice);
        formData.append('ajax', '1');
        formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

        isSpinning = true;
        btn.disabled = true;
        btn.classList.add('opacity-50');
        btn.innerHTML = '<span>⏳</span> Girando la Ruleta...';

        // 1. ARRANCAR GIRO DE INMEDIATO
        currentDegrees += 1800 + Math.floor(Math.random() * 360);
        wheel.style.transform = `rotate(${currentDegrees}deg)`;
        resultBox.innerHTML = '<span class="text-xs text-yellow-300 font-bold animate-pulse">La bola rueda sobre la ruleta...</span>';
        
        try { tg?.HapticFeedback?.impactOccurred('heavy'); } catch(e) {}

        // Ticks de sonido/vibración háptica mientras gira
        let ticks = 0;
        const tickInterval = setInterval(() => {
            try { tg?.HapticFeedback?.impactOccurred('light'); } catch(e) {}
            ticks++;
            if (ticks > 9) clearInterval(tickInterval);
        }, 300);

        try {
            const response = await fetch("{% url 'economy:casino' %}", {
                method: 'POST',
                body: formData,
                headers: { 
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            const data = await response.json();

            // Esperar que la rueda complete sus 3.5 segundos de física
            setTimeout(() => {
                clearInterval(tickInterval);
                isSpinning = false;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                btn.innerHTML = '<span>🎡</span> Girar Ruleta Imperial';

                if (!data.success) {
                    resultBox.innerHTML = `<span class="text-xs text-red-400 font-bold">❌ ${data.error}</span>`;
                    try { tg?.HapticFeedback?.notificationOccurred('error'); } catch(e) {}
                    return;
                }

                // 1. Actualizar el centro con el NÚMERO y COLOR GANADOR
                centerNum.innerText = data.numero_ganador;
                if (data.color_ganador === 'red') {
                    centerText.innerText = "ROJO";
                    centerText.className = "text-[9px] uppercase font-bold text-red-400 tracking-widest mt-0.5";
                } else if (data.color_ganador === 'black') {
                    centerText.innerText = "NEGRO";
                    centerText.className = "text-[9px] uppercase font-bold text-stone-300 tracking-widest mt-0.5";
                } else {
                    centerText.innerText = "CERO";
                    centerText.className = "text-[9px] uppercase font-bold text-emerald-400 tracking-widest mt-0.5";
                }

                // 2. Actualizar el saldo visual en la esquina
                if (balanceElem) {
                    balanceElem.innerText = data.nuevo_saldo;
                }

                // 3. Mostrar banner de victoria o derrota
                if (data.resultado === 'win') {
                    playCoins();
                    playWinSound();
                    resultBox.innerHTML = `
                        <div class="p-2.5 bg-emerald-950/90 border border-emerald-500 rounded-xl text-emerald-200 text-xs font-bold w-full animate-bounce shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                            🎉 ¡Acertaste! Cayó el ${data.numero_ganador} (${centerText.innerText}). Has ganado +${data.ganancia} 🪙.
                        </div>
                    `;
                    try { tg?.HapticFeedback?.notificationOccurred('success'); } catch(e) {}
                } else {
                    resultBox.innerHTML = `
                        <div class="p-2.5 bg-rose-950/80 border border-rose-500 rounded-xl text-rose-200 text-xs font-bold w-full shadow">
                            💀 Salió el ${data.numero_ganador} (${centerText.innerText}). Pierdes ${betAmount} 🪙 de oro.
                        </div>
                    `;
                    try { tg?.HapticFeedback?.notificationOccurred('error'); } catch(e) {}
                }

            }, 3500);

        } catch (err) {
            clearInterval(tickInterval);
            isSpinning = false;
            btn.disabled = false;
            btn.classList.remove('opacity-50');
            btn.innerHTML = '<span>🎡</span> Girar Ruleta Imperial';
            resultBox.innerHTML = '<span class="text-xs text-red-400 font-bold">⚠️ Error de conexión al apostar</span>';
        }
    }

    function playWinSound() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioCtx();
            [587.33, 880, 1174.66].forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime + (idx * 0.1));
                gain.gain.setValueAtTime(0.3, ctx.currentTime + (idx * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (idx * 0.1) + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + (idx * 0.1));
                osc.stop(ctx.currentTime + (idx * 0.1) + 0.3);
            });
        } catch(e) {}
    }
</script>
{% endblock %}
