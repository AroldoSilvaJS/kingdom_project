{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col gap-4 mt-2 pb-44 max-w-md mx-auto">
    
    <!-- ENCABEZADO Y VOLVER -->
    <div class="flex justify-between items-center px-1">
        <button type="button" onclick="universalNav('/economy/wallet/')" 
           class="text-xs text-vip-text/70 hover:text-vip-gold bg-black/70 px-3.5 py-1.5 rounded-full border border-vip-gold/30 flex items-center gap-1.5 active:scale-95 transition-all shadow-md">
            <span>⬅</span> <span>Bóveda</span>
        </button>
        <div class="flex items-center gap-1.5 bg-black/80 border border-vip-gold/40 px-3 py-1.5 rounded-full shadow-inner">
            <span class="text-xs">🪙</span>
            <span class="text-xs font-mono font-bold text-gold-gradient" id="top-user-balance">{{ wallet.balance }}</span>
            <span class="text-[9px] uppercase font-bold text-yellow-400">Oro</span>
        </div>
    </div>

    <!-- MESA DE RULETA VIP ANIMADA -->
    <div class="vip-panel p-5 text-center relative overflow-hidden flex flex-col items-center border border-vip-gold/40 shadow-2xl rounded-3xl bg-gradient-to-br from-[#1a0a28] via-[#090212] to-black">
        
        <h2 class="font-serif text-lg font-black text-gold-gradient uppercase tracking-wider">
            Ruleta Real Europea
        </h2>
        <p class="text-[11px] text-stone-400 mb-1">Tope de tu rango: <strong class="text-yellow-400 font-mono">{{ max_bet }} 🪙</strong></p>

        <!-- 🎡 RUEDA CINEMATOGRÁFICA HD CON CASILLAS NUMERADAS -->
        <div class="relative my-3 flex items-center justify-center select-none">
            
            <!-- Aguja Láser Superior Centrada -->
            <div class="absolute -top-3.5 z-30 flex flex-col items-center pointer-events-none filter drop-shadow-[0_2px_8px_rgba(234,179,8,0.9)]">
                <span class="text-yellow-400 text-2xl leading-none animate-pulse">▼</span>
            </div>

            <!-- Rueda Canvas Giratoria -->
            <div id="wheel-wrapper" class="relative w-64 h-64 rounded-full border-4 border-vip-gold shadow-[0_0_35px_rgba(212,175,55,0.4)] flex items-center justify-center overflow-hidden bg-black">
                <canvas id="roulette-canvas" width="280" height="280" class="w-full h-full block will-change-transform"></canvas>

                <!-- Medallón Central Dorado -->
                <div id="center-disc" class="absolute w-20 h-20 rounded-full bg-gradient-to-br from-[#2c1404] via-black to-[#130701] border-2 border-vip-gold shadow-2xl flex flex-col items-center justify-center z-20 pointer-events-none transition-transform duration-300">
                    <span id="center-display-num" class="text-2xl font-black font-mono text-white drop-shadow">
                        👑
                    </span>
                    <span id="center-display-text" class="text-[8.5px] uppercase font-black text-vip-gold tracking-widest mt-0.5">
                        Casino
                    </span>
                </div>
            </div>

        </div>

        <!-- BANNER DE RESULTADO DINÁMICO -->
        <div id="roulette-result-box" class="w-full min-h-[44px] flex items-center justify-center my-1 text-center">
            <span class="text-xs text-stone-400 font-medium">Elige tu casillero y haz girar la rueda real</span>
        </div>

        <!-- CONTROLES DE APUESTA -->
        <div class="w-full flex flex-col gap-3 mt-1">
            <input type="hidden" id="bet_choice_input" value="red">

            <!-- 1. SELECCIÓN DE CASILLERO -->
            <div>
                <label class="block text-[11px] text-vip-gold uppercase font-bold mb-1.5 text-left">1. Selecciona tu Casillero</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="selectChoice('red')" id="btn-choice-red"
                            class="py-3 rounded-2xl border-2 border-red-500 bg-red-600/40 text-white text-xs font-black uppercase flex flex-col items-center justify-center transition-all shadow-[0_0_15px_rgba(239,68,68,0.4)] scale-105">
                        <span class="text-base mb-0.5">🔴</span>
                        <span>Rojo</span>
                        <span class="text-[9px] font-mono opacity-80">x2.0</span>
                    </button>

                    <button type="button" onclick="selectChoice('black')" id="btn-choice-black"
                            class="py-3 rounded-2xl border border-neutral-700 bg-neutral-900/60 text-neutral-300 text-xs font-black uppercase flex flex-col items-center justify-center hover:border-neutral-500 transition-all">
                        <span class="text-base mb-0.5">⚫</span>
                        <span>Negro</span>
                        <span class="text-[9px] font-mono opacity-80">x2.0</span>
                    </button>

                    <button type="button" onclick="selectChoice('zero')" id="btn-choice-zero"
                            class="py-3 rounded-2xl border border-green-900 bg-green-950/30 text-green-400 text-xs font-black uppercase flex flex-col items-center justify-center hover:border-green-500 transition-all">
                        <span class="text-base mb-0.5">🟢</span>
                        <span>Cero (0)</span>
                        <span class="text-[9px] font-mono text-yellow-400 font-bold">x14</span>
                    </button>
                </div>
            </div>

            <!-- 2. MONTO DE APUESTA -->
            <div>
                <label class="block text-[11px] text-vip-gold uppercase font-bold mb-1.5 text-left">2. Oro a Apostar (Máx: {{ max_bet }} 🪙)</label>
                <div class="grid grid-cols-4 gap-1.5 mb-2">
                    <button type="button" onclick="setBet(5)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-xl text-xs font-mono font-bold active:scale-95">5</button>
                    <button type="button" onclick="setBet(10)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-xl text-xs font-mono font-bold active:scale-95">10</button>
                    <button type="button" onclick="setBet(15)" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-xl text-xs font-mono font-bold active:scale-95">15</button>
                    <button type="button" onclick="setBet({{ max_bet }})" class="bg-black/60 border border-vip-gold/30 hover:border-vip-gold text-vip-gold py-1.5 rounded-xl text-xs font-mono font-bold active:scale-95">{{ max_bet }}</button>
                </div>
                <input type="number" id="bet_amount_input" min="1" max="{{ max_bet }}" value="{% if max_bet < 15 %}{{ max_bet }}{% else %}15{% endif %}"
                       class="w-full bg-black/80 border border-vip-gold/40 rounded-xl p-2.5 text-center font-mono font-bold text-white text-base focus:outline-none focus:border-yellow-400">
            </div>

            <!-- BOTÓN DE GIRO -->
            <button type="button" id="roulette-spin-btn" onclick="startRouletteSpin()" 
                    class="btn-gold py-4 rounded-2xl text-xs font-black uppercase tracking-wider shadow-[0_0_20px_rgba(212,175,55,0.4)] mt-1 flex items-center justify-center gap-2 active:scale-95 transition-all">
                <span>🎡</span> Girar Ruleta Imperial
            </button>
        </div>

    </div>

</div>

<!-- SINTETIZADOR DE AUDIO CASINO VIP -->
<script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioCtx() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playTickSound() {
        try {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(380, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.035);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.035);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.035);
        } catch(e) {}
    }

    function playCoins() {
        try {
            const ctx = getAudioCtx();
            [987, 1318, 1567, 2093].forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime + (idx * 0.08));
                gain.gain.setValueAtTime(0.3, ctx.currentTime + (idx * 0.08));
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (idx * 0.08) + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + (idx * 0.08));
                osc.stop(ctx.currentTime + (idx * 0.08) + 0.25);
            });
        } catch(e) {}
    }
</script>

<!-- RENDERIZADO HD Y FÍSICA EXACTA DE LA RULETA -->
<script>
    // 🏛️ Secuencia Oficial Europea (37 casillas, Sentido Horario desde el 0)
    const ROULETTE_ORDER = [
        0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
    ];

    const RED_NUMBERS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

    let currentRotation = 0;
    let isSpinning = false;

    // Dibuja la ruleta en el Canvas una sola vez con nitidez vectorial
    function drawRouletteWheel() {
        const canvas = document.getElementById('roulette-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = cx - 2;
        const sliceAngle = (2 * Math.PI) / 37;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // El 0 se dibuja exactamente en la cúspide superior (-PI/2)
        let startAngle = -Math.PI / 2 - (sliceAngle / 2);

        for (let i = 0; i < 37; i++) {
            const num = ROULETTE_ORDER[i];
            const endAngle = startAngle + sliceAngle;

            // Determina color exacto
            let color = '#151515'; // Negro
            if (num === 0) color = '#15803d'; // Verde
            else if (RED_NUMBERS.includes(num)) color = '#dc2626'; // Rojo

            // Dibuja gajo
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();

            // Borde dorado entre casillas
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Escribe número
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(startAngle + sliceAngle / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px monospace';
            ctx.fillText(num.toString(), radius - 8, 3.5);
            ctx.restore();

            startAngle = endAngle;
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        drawRouletteWheel();
    });

    function selectChoice(choice) {
        if (isSpinning) return;
        document.getElementById('bet_choice_input').value = choice;
        const btnRed = document.getElementById('btn-choice-red');
        const btnBlack = document.getElementById('btn-choice-black');
        const btnZero = document.getElementById('btn-choice-zero');

        btnRed.className = "py-3 rounded-2xl border border-red-900 bg-red-950/30 text-red-300 text-xs font-black uppercase flex flex-col items-center justify-center transition-all";
        btnBlack.className = "py-3 rounded-2xl border border-neutral-700 bg-neutral-900/60 text-neutral-300 text-xs font-black uppercase flex flex-col items-center justify-center transition-all";
        btnZero.className = "py-3 rounded-2xl border border-green-900 bg-green-950/30 text-green-400 text-xs font-black uppercase flex flex-col items-center justify-center transition-all";

        if (choice === 'red') {
            btnRed.className = "py-3 rounded-2xl border-2 border-red-500 bg-red-600/40 text-white text-xs font-black uppercase flex flex-col items-center justify-center transition-all shadow-[0_0_15px_rgba(239,68,68,0.4)] scale-105";
        } else if (choice === 'black') {
            btnBlack.className = "py-3 rounded-2xl border-2 border-neutral-400 bg-neutral-900 text-white text-xs font-black uppercase flex flex-col items-center justify-center transition-all shadow-[0_0_15px_rgba(255,255,255,0.2)] scale-105";
        } else if (choice === 'zero') {
            btnZero.className = "py-3 rounded-2xl border-2 border-green-500 bg-green-700/50 text-white text-xs font-black uppercase flex flex-col items-center justify-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.4)] scale-105";
        }
    }

    function setBet(amount) {
        if (!isSpinning) document.getElementById('bet_amount_input').value = amount;
    }

    async function startRouletteSpin() {
        if (isSpinning) return;

        const betAmount = parseInt(document.getElementById('bet_amount_input').value, 10);
        const betChoice = document.getElementById('bet_choice_input').value;
        const btn = document.getElementById('roulette-spin-btn');
        const canvas = document.getElementById('roulette-canvas');
        const resultBox = document.getElementById('roulette-result-box');
        const centerNum = document.getElementById('center-display-num');
        const centerText = document.getElementById('center-display-text');
        const balanceElem = document.getElementById('top-user-balance');

        if (!betAmount || betAmount <= 0) {
            resultBox.innerHTML = '<span class="text-xs text-rose-400 font-bold">⚠️ Ingresa una apuesta válida</span>';
            return;
        }

        const tgId = (typeof window.getGlobalTgId === 'function') ? window.getGlobalTgId() : '{{ tg_id }}';
        const formData = new FormData();
        formData.append('tg_id', tgId);
        formData.append('bet_amount', betAmount);
        formData.append('bet_choice', betChoice);
        formData.append('ajax', '1');
        formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

        isSpinning = true;
        btn.disabled = true;
        btn.classList.add('opacity-50');
        btn.innerHTML = '<span>⏳</span> Girando la Ruleta...';

        resultBox.innerHTML = '<span class="text-xs text-yellow-300 font-bold animate-pulse">La bola rueda sobre la ruleta...</span>';
        try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('heavy'); } catch(e) {}

        try {
            const response = await fetch("{% url 'economy:casino' %}", {
                method: 'POST',
                body: formData,
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();

            if (!data.success) {
                isSpinning = false;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                btn.innerHTML = '<span>🎡</span> Girar Ruleta Imperial';
                resultBox.innerHTML = `<span class="text-xs text-rose-400 font-bold">❌ ${data.error}</span>`;
                return;
            }

            // 🎯 CÁLCULO ANGULAR MATEMÁTICO EXACTO:
            const winningNum = data.numero_ganador;
            const winningIndex = ROULETTE_ORDER.indexOf(winningNum);
            const sliceDeg = 360 / 37;

            // Cada gajo i está a i * sliceDeg grados del 0 (que está arriba).
            // Para que el gajo 'winningIndex' termine arriba (0°), debemos girar:
            // target = (360 - (winningIndex * sliceDeg))
            const slotTargetDeg = (360 - (winningIndex * sliceDeg)) % 360;

            // Agregamos 6 vueltas completas (2160°) para el efecto dramático de física
            const fullSpins = 2160;
            const currentMod = currentRotation % 360;
            const delta = (slotTargetDeg - currentMod + 360) % 360;
            const nextRotation = currentRotation + fullSpins + delta;

            currentRotation = nextRotation;

            // Animación CSS con curva de deceleración física de casino
            canvas.style.transition = 'transform 3.6s cubic-bezier(0.12, 0.88, 0.22, 1)';
            canvas.style.transform = `rotate(${nextRotation}deg)`;

            // Ticks de sonido y haptic progresivos
            let ticks = 0;
            const tickInt = setInterval(() => {
                playTickSound();
                try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light'); } catch(e) {}
                ticks++;
                if (ticks > 12) clearInterval(tickInt);
            }, 260);

            // Momento exacto del frenado
            setTimeout(() => {
                clearInterval(tickInt);
                isSpinning = false;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                btn.innerHTML = '<span>🎡</span> Girar Ruleta Imperial';

                // Actualizar Medallón Central
                centerNum.innerText = winningNum;
                if (data.color_ganador === 'red') {
                    centerText.innerText = "ROJO";
                    centerText.className = "text-[8.5px] uppercase font-black text-rose-400 tracking-widest mt-0.5";
                } else if (data.color_ganador === 'black') {
                    centerText.innerText = "NEGRO";
                    centerText.className = "text-[8.5px] uppercase font-black text-stone-300 tracking-widest mt-0.5";
                } else {
                    centerText.innerText = "CERO";
                    centerText.className = "text-[8.5px] uppercase font-black text-emerald-400 tracking-widest mt-0.5";
                }

                if (balanceElem) balanceElem.innerText = data.nuevo_saldo;

                if (data.resultado === 'win') {
                    playCoins();
                    resultBox.innerHTML = `
                        <div class="p-2.5 bg-emerald-950/90 border border-emerald-500 rounded-2xl text-emerald-200 text-xs font-bold w-full animate-bounce shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                            🎉 ¡Acertaste! Cayó el ${winningNum} (${centerText.innerText}). Ganaste +${data.ganancia} 🪙.
                        </div>`;
                    try { window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('success'); } catch(e) {}
                } else {
                    resultBox.innerHTML = `
                        <div class="p-2.5 bg-rose-950/80 border border-rose-500 rounded-2xl text-rose-200 text-xs font-bold w-full shadow">
                            💀 Salió el ${winningNum} (${centerText.innerText}). Pierdes ${betAmount} 🪙 de oro.
                        </div>`;
                    try { window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('error'); } catch(e) {}
                }

            }, 3650);

        } catch(err) {
            isSpinning = false;
            btn.disabled = false;
            btn.classList.remove('opacity-50');
            btn.innerHTML = '<span>🎡</span> Girar Ruleta Imperial';
            resultBox.innerHTML = '<span class="text-xs text-rose-400 font-bold">⚠️ Error de conexión al girar</span>';
        }
    }
</script>
{% endblock %}
