{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kingdom of Pleasure - VIP</title>
    
    <!-- Fuentes Premium de Google: Cinzel (Títulos aristocráticos) y Plus Jakarta Sans (UI moderna) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Script Oficial de Telegram WebApps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Configuración extendida de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vip: {
                            base: '#08040E',      /* Negro obsidiana profundo */
                            card: '#10081C',      /* Fondo de tarjetas */
                            panel: '#150A24',     /* Paneles flotantes */
                            gold: '#D4AF37',      /* Oro imperial clásico */
                            lightgold: '#F3E5AB', /* Brillo de oro suave */
                            accent: '#A855F7',    /* Púrpura místico neón */
                            text: '#EAE6F0'       /* Blanco perla legible */
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        serif: ['"Cinzel"', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Estilos de Alto Impacto Visual -->
    <style>
        body {
            background: radial-gradient(circle at 50% -20%, #200E38 0%, #08040E 60%, #030106 100%);
            color: #EAE6F0;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        /* Paneles con efecto Cristal y borde biselado en oro */
        .vip-panel {
            background: linear-gradient(135deg, rgba(21, 10, 36, 0.85) 0%, rgba(13, 6, 22, 0.95) 100%);
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.08);
            backdrop-filter: blur(12px);
        }

        /* Botón de Oro Pulido con brillo */
        .btn-gold {
            background: linear-gradient(135deg, #ECC440 0%, #D4AF37 50%, #9A7B1C 100%);
            color: #08040E;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
            transition: all 0.25s ease;
        }
        .btn-gold:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.2);
        }

        /* Texto Dorado con efecto de metal líquido */
        .text-gold-gradient {
            background: linear-gradient(135deg, #FFF0B8 0%, #D4AF37 50%, #AA820A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Resplandor suave para títulos */
        .glow-title {
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
        }
    </style>
</head>
<body class="font-sans antialiased flex flex-col items-center min-h-screen relative pb-28">

   <!-- Header Imperial: Logo Grande sin fondo negro -->
    <header class="w-full max-w-md pt-2 pb-1 px-2 flex flex-col items-center z-20">
        <div class="relative w-full flex justify-center items-center py-1">
            <!-- Halo de resplandor dorado sutil detrás del logo -->
            <div class="absolute w-44 h-24 bg-gradient-to-r from-amber-600/25 via-yellow-500/35 to-amber-600/25 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Logo Grande con eliminación de fondo negro mediante mix-blend-mode -->
            <img src="/media/logo.png" 
                 alt="Kingdom of Pleasure" 
                 class="h-28 sm:h-32 w-auto object-contain relative z-10 transition-transform duration-300 hover:scale-105 filter drop-shadow-[0_0_20px_rgba(212,175,55,0.6)]"
                 style="mix-blend-mode: screen;">
        </div>
        
        <!-- Línea divisoria imperial -->
        <div class="w-48 h-[1px] bg-gradient-to-r from-transparent via-vip-gold/70 to-transparent mt-0.5"></div>
    </header>

    <!-- Contenedor Dinámico de Vistas -->
    <main class="w-full max-w-md flex-1 px-4 z-10">
        {% block content %}
        {% endblock %}
    </main>

    <!-- 📱 BARRA DE NAVEGACIÓN INFERIOR BLINDADA ESTILO TELEGRAM MINI APP -->
    <div class="fixed bottom-0 inset-x-0 z-[99999] pointer-events-none pb-[max(0.75rem,env(safe-area-inset-bottom))] px-3 pt-2">
        <nav class="max-w-md mx-auto pointer-events-auto bg-[#0a0514]/95 border border-vip-gold/40 backdrop-blur-xl rounded-2xl p-1.5 px-2 flex justify-between items-center shadow-[0_10px_35px_rgba(0,0,0,0.95),0_0_15px_rgba(212,175,55,0.25)]">
            
            <!-- 1. Inicio -->
            <button type="button" onclick="universalNav('/')" 
                    class="flex-1 flex flex-col items-center justify-center py-1.5 px-1 text-stone-300 hover:text-vip-gold active:scale-90 transition-all select-none">
                <span class="text-xl leading-none">🏛️</span>
                <span class="text-[9px] font-bold uppercase tracking-wider mt-1 text-stone-300">Inicio</span>
            </button>

            <!-- 2. Feed VIP -->
            <button type="button" onclick="universalNav('/idols/feed/')" 
                    class="flex-1 flex flex-col items-center justify-center py-1.5 px-1 text-stone-300 hover:text-purple-300 active:scale-90 transition-all select-none">
                <span class="text-xl leading-none">📱</span>
                <span class="text-[9px] font-bold uppercase tracking-wider mt-1 text-stone-300">Muro</span>
            </button>

            <!-- 3. Botón Central Intuitivo: ELENCO DE IDOLS (Antifaz Veneciano & Corona) -->
            <button type="button" onclick="universalNav('/idols/gallery/')" 
                    class="-mt-6 bg-gradient-to-tr from-amber-500 via-yellow-300 to-amber-600 text-stone-950 w-14 h-14 rounded-full border-2 border-yellow-100 flex flex-col items-center justify-center shadow-[0_0_25px_rgba(212,175,55,0.85)] active:scale-90 transition-all select-none mx-1 hover:brightness-110">
                <span class="text-2xl leading-none">🎭</span>
                <span class="text-[8px] font-black uppercase tracking-tighter text-stone-950 leading-tight mt-0.5">Elenco</span>
            </button>

            <!-- 4. Mascotas -->
            <button type="button" onclick="universalNav('/pets/')" 
                    class="flex-1 flex flex-col items-center justify-center py-1.5 px-1 text-stone-300 hover:text-purple-300 active:scale-90 transition-all select-none">
                <span class="text-xl leading-none">🐾</span>
                <span class="text-[9px] font-bold uppercase tracking-wider mt-1 text-stone-300">Santuario</span>
            </button>

            <!-- 5. Bóveda -->
            <button type="button" onclick="universalNav('/economy/wallet/')" 
                    class="flex-1 flex flex-col items-center justify-center py-1.5 px-1 text-stone-300 hover:text-vip-gold active:scale-90 transition-all select-none">
                <span class="text-xl leading-none">🪙</span>
                <span class="text-[9px] font-bold uppercase tracking-wider mt-1 text-stone-300">Bóveda</span>
            </button>

        </nav>
    </div>

    <!-- Script de Autenticación y Navegación Oficial de Telegram Mini App -->
    <script>
        const tgApp = window.Telegram?.WebApp;
        if (tgApp) {
            try {
                tgApp.expand();
                tgApp.ready();
            } catch(e) {}
        }

        // Obtener el ID y el @ de Telegram del usuario que TIENE LA APP ABIERTA AHORA MISMO
        function getRealTelegramUser() {
            const tgUser = tgApp?.initDataUnsafe?.user;
            if (tgUser && tgUser.id) {
                const tgHandle = tgUser.username ? `@${tgUser.username}` : (tgUser.first_name || `Usuario_${tgUser.id}`);
                return {
                    id: String(tgUser.id),
                    username: tgHandle
                };
            }

            const urlParams = new URLSearchParams(window.location.search);
            const urlId = urlParams.get('tg_id');
            if (urlId && urlId !== 'None' && urlId !== 'undefined' && urlId.trim() !== '') {
                const urlName = urlParams.get('tg_username') || `Noble_${urlId}`;
                return {
                    id: urlId,
                    username: urlName.startsWith('@') ? urlName : `@${urlName}`
                };
            }

            return {
                id: localStorage.getItem('current_tg_id') || '123456789',
                username: localStorage.getItem('current_tg_user') || 'Invitado'
            };
        }

        // Sincronizar cuenta al cargar la página: Si la URL trae el ID de otra persona, forzar la cuenta del móvil actual
        (function syncAccount() {
            const currentUser = getRealTelegramUser();
            const urlParams = new URLSearchParams(window.location.search);
            const currentUrlId = urlParams.get('tg_id');
            const currentUrlName = urlParams.get('tg_username');

            localStorage.setItem('current_tg_id', currentUser.id);
            localStorage.setItem('current_tg_user', currentUser.username);

            // Si Telegram WebApp reporta un usuario y la URL tiene el de otra persona (o ninguno), corregir de inmediato
            if (tgApp?.initDataUnsafe?.user && (currentUrlId !== currentUser.id || !currentUrlName)) {
                const cleanUrl = window.location.pathname;
                window.location.replace(`${cleanUrl}?tg_id=${currentUser.id}&tg_username=${encodeURIComponent(currentUser.username)}`);
            }
        })();

        // Navegación universal limpia
        window.universalNav = function(targetPath) {
            try {
                tgApp?.HapticFeedback?.impactOccurred('light');
            } catch(e) {}

            const user = getRealTelegramUser();
            const cleanPath = targetPath.split('?')[0];
            window.location.href = `${cleanPath}?tg_id=${user.id}&tg_username=${encodeURIComponent(user.username)}`;
        };

        window.navGo = window.universalNav;
        window.getGlobalTgId = function() { return getRealTelegramUser().id; };
        window.getGlobalTgUser = function() { return getRealTelegramUser().username; };
    </script>
</body>
</html>
