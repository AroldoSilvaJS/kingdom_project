{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kingdom of Pleasure - VIP</title>
    
    <!-- Fuentes Premium de Google: Cinzel y Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Script Oficial de Telegram WebApps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Configuración extendida de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vip: {
                            base: '#08040E',      /* Negro obsidiana profundo */
                            card: '#10081C',      /* Fondo de tarjetas */
                            panel: '#150A24',     /* Paneles flotantes */
                            gold: '#D4AF37',      /* Oro imperial clásico */
                            lightgold: '#F3E5AB', /* Brillo de oro suave */
                            accent: '#A855F7',    /* Púrpura místico neón */
                            text: '#EAE6F0'       /* Blanco perla legible */
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        serif: ['"Cinzel"', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Estilos de Alto Impacto Visual -->
    <style>
        body {
            background: radial-gradient(circle at 50% -20%, #200E38 0%, #08040E 60%, #030106 100%);
            color: #EAE6F0;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        .vip-panel {
            background: linear-gradient(135deg, rgba(21, 10, 36, 0.85) 0%, rgba(13, 6, 22, 0.95) 100%);
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.08);
            backdrop-filter: blur(12px);
        }

        .btn-gold {
            background: linear-gradient(135deg, #ECC440 0%, #D4AF37 50%, #9A7B1C 100%);
            color: #08040E;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
            transition: all 0.25s ease;
        }
        .btn-gold:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.2);
        }

        .text-gold-gradient {
            background: linear-gradient(135deg, #FFF0B8 0%, #D4AF37 50%, #AA820A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glow-title {
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
        }
    </style>
</head>


<body class="font-sans antialiased flex flex-col items-center min-h-screen relative pb-28">

    <!-- 📢 NOTIFICACIONES FLASH GLOBALES (SE MUESTRAN SIEMPRE EN LA PÁGINA ACTUAL Y DESAPARECEN SOLAS) -->
    {% if messages %}
    <div id="django-messages-container" class="fixed top-3 inset-x-3 z-[999999] space-y-2 max-w-md mx-auto pointer-events-auto">
      {% for message in messages %}
        <div class="p-3.5 rounded-2xl border backdrop-blur-md text-xs font-bold shadow-2xl flex justify-between items-center transition-all animate-bounce
          {% if message.tags == 'success' %}bg-emerald-950/95 border-emerald-500 text-emerald-200
          {% elif message.tags == 'warning' %}bg-amber-950/95 border-amber-500 text-amber-200
          {% else %}bg-rose-950/95 border-rose-500 text-rose-200{% endif %}">
          <span>{{ message }}</span>
          <button onclick="this.parentElement.remove()" class="ml-2 text-stone-400 hover:text-white text-base">&times;</button>
        </div>
      {% endfor %}
    </div>
    <script>
      setTimeout(() => {
        const mc = document.getElementById('django-messages-container');
        if (mc) mc.remove();
      }, 4000);
    </script>
    {% endif %}

    <!-- Header Imperial con Campanita de Buzón -->
    <header class="w-full max-w-md pt-2 pb-1 px-3 flex flex-col items-center z-20 relative">
        
        {% if not hide_bottom_nav %}
        <button type="button" onclick="universalNav('/buzon/')" 
                class="absolute right-3 top-3 bg-black/70 hover:bg-black border border-vip-gold/40 text-yellow-300 w-9 h-9 rounded-full flex items-center justify-center text-sm shadow-[0_0_12px_rgba(212,175,55,0.3)] active:scale-90 transition-all z-30 relative" 
                title="Abrir Buzón Real">
            <span>🔔</span>
            {% if unread_notifications_count > 0 %}
                <span class="absolute -top-1 -right-1 bg-rose-600 text-white text-[9px] font-mono font-black w-4 h-4 rounded-full flex items-center justify-center border border-white shadow animate-pulse">
                    {{ unread_notifications_count }}
                </span>
            {% endif %}
        </button>
        {% endif %}

        <div class="relative w-full flex justify-center items-center py-1">
            <div class="absolute w-44 h-24 bg-gradient-to-r from-amber-600/25 via-yellow-500/35 to-amber-600/25 rounded-full blur-2xl pointer-events-none"></div>

            <img src="/media/logo.png" 
                 alt="Kingdom of Pleasure" 
                 class="h-28 sm:h-32 w-auto object-contain relative z-10 transition-transform duration-300 hover:scale-105 filter drop-shadow-[0_0_20px_rgba(212,175,55,0.6)]"
                 style="mix-blend-mode: screen;">
        </div>
        
        <div class="w-48 h-[1px] bg-gradient-to-r from-transparent via-vip-gold/70 to-transparent mt-0.5"></div>
    </header>

    <!-- Contenedor Dinámico de Vistas -->
    <main class="w-full max-w-md flex-1 px-4 z-10">
        {% block content %}
        {% endblock %}
    </main>

    <!-- 📱 BARRA DE NAVEGACIÓN INFERIOR DINÁMICA -->
    {% if not hide_bottom_nav %}
    <div class="fixed bottom-0 inset-x-0 z-[99999] pointer-events-none pb-[max(0.6rem,env(safe-area-inset-bottom))] px-2.5 pt-1.5">
        <nav class="max-w-md mx-auto pointer-events-auto bg-[#0a0514]/95 border border-vip-gold/40 backdrop-blur-xl rounded-2xl p-1.5 px-1 shadow-[0_10px_35px_rgba(0,0,0,0.95),0_0_18px_rgba(212,175,55,0.22)]">
            <div class="grid grid-cols-6 gap-0.5 items-center justify-items-stretch" id="bottom-nav-bar">
                
                <!-- 1. Inicio -->
                <button type="button" data-nav="/" onclick="universalNav('/')" 
                        class="nav-tab w-full flex flex-col items-center justify-center py-1.5 px-0.5 text-stone-400 hover:text-vip-gold active:scale-90 transition-all select-none rounded-xl">
                    <span class="text-base sm:text-lg leading-none">🏛️</span>
                    <span class="text-[8px] sm:text-[8.5px] font-bold uppercase tracking-tight mt-1">Inicio</span>
                </button>

                <!-- 2. Feed VIP -->
                <button type="button" data-nav="/idols/feed/" onclick="universalNav('/idols/feed/')" 
                        class="nav-tab w-full flex flex-col items-center justify-center py-1.5 px-0.5 text-stone-400 hover:text-purple-300 active:scale-90 transition-all select-none rounded-xl">
                    <span class="text-base sm:text-lg leading-none">📱</span>
                    <span class="text-[8px] sm:text-[8.5px] font-bold uppercase tracking-tight mt-1">Muro</span>
                </button>

                <!-- 3. Cajas CS -->
                <button type="button" data-nav="/idols/photocards/" onclick="universalNav('/idols/photocards/')" 
                        class="nav-tab w-full flex flex-col items-center justify-center py-1.5 px-0.5 text-stone-400 hover:text-yellow-400 active:scale-90 transition-all select-none rounded-xl">
                    <span class="text-base sm:text-lg leading-none">🎁</span>
                    <span class="text-[8px] sm:text-[8.5px] font-bold uppercase tracking-tight mt-1">Cajas</span>
                </button>

                <!-- 4. Elenco de Musas -->
                <button type="button" data-nav="/idols/gallery/" onclick="universalNav('/idols/gallery/')" 
                        class="nav-tab w-full flex flex-col items-center justify-center py-1.5 px-0.5 text-stone-400 hover:text-vip-gold active:scale-90 transition-all select-none rounded-xl">
                    <span class="text-base sm:text-lg leading-none">🎭</span>
                    <span class="text-[8px] sm:text-[8.5px] font-bold uppercase tracking-tight mt-1">Elenco</span>
                </button>

                <!-- 5. Santuario -->
                <button type="button" data-nav="/pets/" onclick="universalNav('/pets/')" 
                        class="nav-tab w-full flex flex-col items-center justify-center py-1.5 px-0.5 text-stone-400 hover:text-purple-300 active:scale-90 transition-all select-none rounded-xl">
                    <span class="text-base sm:text-lg leading-none">🐾</span>
                    <span class="text-[8px] sm:text-[8.5px] font-bold uppercase tracking-tight mt-1">Santuario</span>
                </button>

                <!-- 6. Bóveda -->
                <button type="button" data-nav="/economy/wallet/" onclick="universalNav('/economy/wallet/')" 
                        class="nav-tab w-full flex flex-col items-center justify-center py-1.5 px-0.5 text-stone-400 hover:text-vip-gold active:scale-90 transition-all select-none rounded-xl">
                    <span class="text-base sm:text-lg leading-none">🪙</span>
                    <span class="text-[8px] sm:text-[8.5px] font-bold uppercase tracking-tight mt-1">Bóveda</span>
                </button>

            </div>
        </nav>
    </div>
    {% endif %}

    <!-- MODAL VIP FLOTANTE UNIVERSAL -->
    <div id="vip-global-modal" class="hidden fixed inset-0 z-[999999] bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
        <div class="vip-panel p-5 max-w-xs w-full text-center border-2 border-vip-gold/60 rounded-3xl shadow-2xl flex flex-col items-center bg-gradient-to-b from-[#1c0c2e] to-black">
            <span id="vip-modal-icon" class="text-3xl mb-1">👑</span>
            <h4 id="vip-modal-title" class="font-serif text-sm font-black text-gold-gradient uppercase tracking-wider mb-1">Aviso Imperial</h4>
            <p id="vip-modal-text" class="text-xs text-stone-300 leading-relaxed mb-4"></p>
            <button type="button" onclick="closeVipAlert()" class="w-full btn-gold py-2.5 rounded-xl text-xs font-black uppercase tracking-wider shadow">
                Entendido
            </button>
        </div>
    </div>

    <!-- Script de Autenticación y Navegación Oficial de Telegram Mini App -->
    <script>
        const tgApp = window.Telegram?.WebApp;
        if (tgApp) {
            try {
                tgApp.expand();
                tgApp.ready();
            } catch(e) {}
        }

        function getRealTelegramUser() {
            const tgUser = tgApp?.initDataUnsafe?.user;
            if (tgUser && tgUser.id) {
                const tgHandle = tgUser.username ? `@${tgUser.username}` : (tgUser.first_name || `Usuario_${tgUser.id}`);
                return {
                    id: String(tgUser.id),
                    username: tgHandle
                };
            }

            const urlParams = new URLSearchParams(window.location.search);
            const urlId = urlParams.get('tg_id');
            if (urlId && urlId !== 'None' && urlId !== 'undefined' && urlId.trim() !== '') {
                const urlName = urlParams.get('tg_username') || `Noble_${urlId}`;
                return {
                    id: urlId,
                    username: urlName.startsWith('@') ? urlName : `@${urlName}`
                };
            }

            return {
                id: localStorage.getItem('current_tg_id') || '123456789',
                username: localStorage.getItem('current_tg_user') || 'Invitado'
            };
        }

        (function syncAccount() {
            const currentUser = getRealTelegramUser();
            const urlParams = new URLSearchParams(window.location.search);
            const currentUrlId = urlParams.get('tg_id');
            const currentUrlName = urlParams.get('tg_username');

            localStorage.setItem('current_tg_id', currentUser.id);
            localStorage.setItem('current_tg_user', currentUser.username);

            if (tgApp?.initDataUnsafe?.user && (currentUrlId !== currentUser.id || !currentUrlName)) {
                const targetPath = (window.location.pathname.includes('choose-role') && currentUrlId === '123456789') ? '/' : window.location.pathname;
                window.location.replace(`${targetPath}?tg_id=${currentUser.id}&tg_username=${encodeURIComponent(currentUser.username)}`);
            }
        })();

        window.universalNav = function(targetPath) {
            try {
                tgApp?.HapticFeedback?.impactOccurred('light');
            } catch(e) {}

            const user = getRealTelegramUser();
            const cleanPath = targetPath.split('?')[0];
            window.location.href = `${cleanPath}?tg_id=${user.id}&tg_username=${encodeURIComponent(user.username)}`;
        };

        window.navGo = window.universalNav;
        window.getGlobalTgId = function() { return getRealTelegramUser().id; };
        window.getGlobalTgUser = function() { return getRealTelegramUser().username; };

        (function highlightActiveTab() {
            const path = window.location.pathname;
            document.querySelectorAll('.nav-tab').forEach(tab => {
                const tabPath = tab.getAttribute('data-nav');
                const isActive = (tabPath === '/' && path === '/') || (tabPath !== '/' && path.startsWith(tabPath));
                
                if (isActive) {
                    tab.className = "nav-tab w-full flex flex-col items-center justify-center py-1.5 px-0.5 text-vip-gold active:scale-90 transition-all select-none rounded-xl bg-gradient-to-b from-yellow-500/15 to-transparent border border-vip-gold/30 shadow-[0_0_10px_rgba(212,175,55,0.2)]";
                    tab.querySelector('span:last-child').className = "text-[8px] sm:text-[8.5px] font-black uppercase tracking-tight mt-1 text-vip-gold";
                }
            });
        })();

        window.showVipAlert = function(msg, title = "Aviso de la Corte", icon = "👑") {
            try { window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('warning'); } catch(e) {}
            document.getElementById('vip-modal-title').innerText = title;
            document.getElementById('vip-modal-text').innerText = msg;
            document.getElementById('vip-modal-icon').innerText = icon;
            document.getElementById('vip-global-modal').classList.remove('hidden');
        };
        window.closeVipAlert = function() {
            document.getElementById('vip-global-modal').classList.add('hidden');
        };

        window.openImageLightbox = function(src, caption = '') {
            try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('medium'); } catch(e) {}
            const modal = document.getElementById('image-lightbox-modal');
            const img = document.getElementById('lightbox-img');
            const cap = document.getElementById('lightbox-caption');
            if (modal && img) {
                img.src = src;
                cap.innerText = caption ? `«${caption}»` : '';
                modal.classList.remove('hidden');
            }
        };
        window.closeImageLightbox = function() {
            const modal = document.getElementById('image-lightbox-modal');
            if (modal) modal.classList.add('hidden');
        };
    </script>
    <!-- 🖼️ VISOR MODAL LIGHTBOX PANTALLA COMPLETA -->
    <div id="image-lightbox-modal" class="hidden fixed inset-0 z-[999999] bg-black/95 backdrop-blur-2xl flex flex-col items-center justify-center p-3 select-none" onclick="closeImageLightbox()">
        <!-- Botón Cerrar -->
        <button type="button" onclick="closeImageLightbox()" 
                class="absolute top-4 right-4 text-stone-300 hover:text-white bg-black/80 border border-vip-gold/50 rounded-full w-10 h-10 flex items-center justify-center text-xl z-20 shadow-lg active:scale-90 transition-all">
            &times;
        </button>

        <div class="relative max-w-md w-full flex flex-col items-center" onclick="event.stopPropagation()">
            <div class="rounded-3xl overflow-hidden border-2 border-vip-gold/60 shadow-[0_0_50px_rgba(212,175,55,0.4)] bg-black max-h-[82vh] flex items-center justify-center">
                <img id="lightbox-img" src="" alt="Foto VIP" class="w-full h-auto max-h-[80vh] object-contain block">
            </div>
            <p id="lightbox-caption" class="text-xs text-stone-200 text-center mt-3 px-4 italic font-medium leading-relaxed"></p>
        </div>
    </div>

</body>
</html>
