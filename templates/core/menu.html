{% extends 'base.html' %}

{% block content %}
<div class="vip-panel p-6 mt-8 flex flex-col gap-4 mx-auto w-[90%]">
    <!-- Le pusimos un ID al H2 para cambiarlo con JavaScript -->
    <h2 id="username-display" class="text-xl font-semibold text-vip-gold text-center mb-2">Bienvenido, Invitado</h2>
    
    <p class="text-sm text-center text-vip-text/70 mb-6">
        Selecciona tu destino dentro del Kingdom...
    </p>
    
    <button onclick="window.location.href='/idols/gallery/'" class="w-full mb-2 bg-gradient-to-r from-vip-base to-[#1f1033] border border-vip-gold text-vip-gold py-4 rounded-lg hover:brightness-125 transition-all duration-300 font-bold flex items-center justify-center gap-3 shadow-[0_0_10px_rgba(212,175,55,0.2)]">
        <span class="text-2xl">✨</span> 
        <span class="tracking-wider">VER ELENCO (GALERÍA)</span>
        <span class="text-2xl">✨</span>
    </button>

    <!-- 🏆 SALÓN DE LA FAMA -->
    <button onclick="window.location.href='/salon-de-la-fama/?tg_id={{ tg_id }}'" 
            class="w-full mb-2 bg-gradient-to-r from-[#1c1204] via-vip-panel to-vip-base border border-yellow-500/60 text-yellow-400 py-3.5 rounded-lg hover:brightness-125 transition-all duration-300 font-bold flex items-center justify-center gap-2.5 shadow-[0_0_12px_rgba(212,175,55,0.15)]">
        <span class="text-xl">🏆</span>
        <span class="tracking-wider uppercase text-xs">Salón de la Fama</span>
        <span class="text-xl">👑</span>
    </button>

    {% if is_admin %}
    <!-- 👑 ESTE BOTÓN SOLO LO VE EL ADMIN (TÚ) -->
    <button onclick="window.location.href='/admin-panel/?tg_id={{ tg_id }}'" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-900 border border-vip-gold text-white py-4 rounded-lg hover:brightness-125 transition-all duration-300 font-black flex items-center justify-center gap-3 shadow-[0_0_15px_rgba(212,175,55,0.4)] mb-4 tracking-widest">
        <span class="text-2xl">👑</span> PANEL DE CONTROL VIP
    </button>
    {% endif %}

    
    <!-- Botones de Navegación -->
    <button onclick="goToFeed()" class="w-full bg-gradient-to-r from-purple-900/40 to-vip-base border border-purple-500/50 text-purple-200 py-3 rounded-lg hover:bg-purple-900 hover:text-white transition-colors duration-300 font-medium flex items-center justify-center gap-2 shadow-[0_0_10px_rgba(168,85,247,0.1)]">
        <span>📱</span> Muro VIP
    </button>

    {% if role == 'idol' %}
    <button onclick="goToMisIdols()" class="w-full bg-vip-base border border-vip-gold/50 text-vip-gold py-3 rounded-lg hover:bg-vip-gold hover:text-vip-base transition-colors duration-300 font-medium flex items-center justify-center gap-2">
        <span>🎭</span> Mis Idols
    </button>
    {% endif %}
    
    <button onclick="goToWallet()" class="w-full bg-vip-base border border-vip-gold/50 text-vip-gold py-3 rounded-lg hover:bg-vip-gold hover:text-vip-base transition-colors duration-300 font-medium flex items-center justify-center gap-2">
        <span>💰</span> Mi Bóveda VIP
    </button>

   <!-- 🐾 SANTUARIO DE MASCOTAS -->
    <button onclick="goToPets()" 
            class="w-full mb-2 bg-gradient-to-r from-[#1c0e2a] via-vip-panel to-vip-base border border-purple-500/50 text-purple-300 py-3 rounded-lg hover:brightness-125 transition-all duration-300 font-bold flex items-center justify-center gap-2 shadow-[0_0_12px_rgba(168,85,247,0.15)]">
        <span class="text-lg">🐾</span>
        <span class="tracking-wider uppercase text-xs">Mascotas Reales</span>
    </button>

</div>

<!-- Script para leer Telegram WebApp -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Objeto global de Telegram
        const tg = window.Telegram.WebApp;
        
        // Si la app se abre dentro de Telegram, initDataUnsafe tendrá los datos
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const firstName = tg.initDataUnsafe.user.first_name;
            document.getElementById('username-display').innerText = `Bienvenido, ${firstName}`;
        }
    });

    function goToFeed() {
        const tg = window.Telegram.WebApp;
        const tgId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : '123456789';
        window.location.href = `/idols/feed/?tg_id=${tgId}`;
    }

    function goToMisIdols() {
        const tg = window.Telegram.WebApp;
        const user = tg.initDataUnsafe?.user;
        
        const tgId = user ? user.id : '123456789';
        
        // Extraemos el @username, si no tiene, usamos su primer nombre
        let tgName = 'Roller VIP';
        if (user) {
            tgName = user.username ? `@${user.username}` : user.first_name;
        }
        
        // Lo enviamos por la URL (encodeURIComponent asegura que los caracteres especiales como el @ no rompan el link)
        window.location.href = `/idols/?tg_id=${tgId}&tg_username=${encodeURIComponent(tgName)}`;
    }

    function goToWallet() {
        const tg = window.Telegram.WebApp;
        const tgId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : '123456789';
        window.location.href = `/economy/wallet/?tg_id=${tgId}`;
    }

    function goToPets() {
        const tg = window.Telegram.WebApp;
        const tgId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : '123456789';
        window.location.href = `/pets/?tg_id=${tgId}`;
    }
</script>
{% endblock %}
